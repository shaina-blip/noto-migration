<style>
:root{
  --green:#6EA370;--green-dk:#527a54;--green-lt:#e8f5e9;--green-pale:#f4fbf3;
  --blue:#1E6396;--blue-lt:#e8eef5;--blue-pale:#f0f4f8;
  --amber:#FDF3E3;--amber-bd:#f0c080;--amber-txt:#8a5c00;
  --red-lt:#fff0f0;--red-bd:#f0b0b0;--red-txt:#b02020;
  --text:#2B2B2B;--muted:#6B6B6B;--border:#dde8d6;--bg:#f5f7f2;
  --radius:8px;--font:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:var(--bg)}
.app{display:flex;height:100vh}
.sidebar{width:268px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border)}
.main{flex:1;overflow-y:auto;min-width:0}
.s-head{padding:14px 16px;background:var(--green);display:flex;align-items:center;gap:10px;flex-shrink:0}
.s-logo{width:30px;height:30px;flex-shrink:0;opacity:.95}
.s-brand{color:#fff;line-height:1.25}
.s-brand strong{display:block;font-size:14px;font-weight:700;letter-spacing:.01em}
.s-brand span{font-size:10px;font-weight:400;opacity:.8;letter-spacing:.05em;text-transform:uppercase}
.s-search{padding:10px 12px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.s-search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);color:var(--green);pointer-events:none}
.s-search input{width:100%;padding:7px 10px 7px 30px;font-size:13px;font-family:var(--font);border:1px solid var(--border);border-radius:var(--radius);background:var(--green-pale);color:var(--text);outline:none;transition:border .15s}
.s-search input:focus{border-color:var(--green);background:#fff}
.s-filters{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.fb{font-size:11px;padding:3px 9px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .15s}
.fb:hover{border-color:var(--green);color:var(--green)}
.fb.on{background:var(--green);color:#fff;border-color:var(--green)}
.s-sort-row{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ctrl-select{flex:1;min-width:0;font-size:11px;padding:5px 7px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);font-family:var(--font);cursor:pointer;outline:none}
.ctrl-select:focus{border-color:var(--green)}
.s-meta{padding:5px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-shrink:0;background:var(--bg)}
.s-io{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.io-btn{flex:1;font-size:11px;font-weight:600;font-family:var(--font);padding:5px 6px;border-radius:var(--radius);cursor:pointer;text-align:center;transition:all .15s}
.io-btn.export{background:var(--green-pale);color:var(--green-dk);border:1px solid var(--border)}
.io-btn.export:hover{background:var(--green-lt);border-color:var(--green)}
.io-btn.import{background:var(--blue-pale);color:var(--blue);border:1px solid var(--border)}
.io-btn.import:hover{background:var(--blue-lt);border-color:var(--blue)}
.s-list{overflow-y:auto;flex:1}
.s-list::-webkit-scrollbar{width:4px}
.s-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.li{display:flex;align-items:flex-start;gap:8px;padding:9px 10px 9px 11px;border-bottom:1px solid #f0f4ec;cursor:pointer;transition:background .1s;user-select:none}
.li:hover{background:var(--green-pale)}
.li.active{background:var(--green-lt)}
.li.done .li-name{color:var(--muted);text-decoration:line-through}
.li.done{opacity:.6}
.li-cb{margin-top:2px;width:14px;height:14px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.li-body{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.li-sub{font-size:11px;color:var(--muted);margin-top:1px}
.li-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.chip{font-size:10px;padding:2px 7px;border-radius:8px;white-space:nowrap;font-weight:500}
.chip-prog{background:var(--blue-lt);color:var(--blue)}
.chip-done{background:var(--green-lt);color:var(--green-dk)}
.chip-early{background:var(--amber);color:var(--amber-txt)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--muted);padding:40px}
.empty svg{opacity:.2}
.empty p{font-size:14px;text-align:center}
.detail-wrap{padding:32px 36px;max-width:900px}
.d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:8px}
.d-name{font-size:26px;font-weight:700;line-height:1.2;color:var(--text)}
.d-name.done{text-decoration:line-through;color:var(--muted)}
.d-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;margin-top:6px}
.d-chip{font-size:12px;padding:4px 12px;border-radius:12px;font-weight:500}
.d-chip-svc{background:var(--blue-lt);color:var(--blue)}
.d-chip-ed{background:var(--green-pale);color:var(--green-dk);border:1px solid var(--border)}
.d-chip-early{background:var(--amber);color:var(--amber-txt)}
.d-chip-done{background:var(--green-lt);color:var(--green-dk)}
.mark-btn{padding:9px 20px;font-size:13px;font-weight:600;font-family:var(--font);border-radius:var(--radius);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.mark-btn.add{background:var(--green);color:#fff;border:2px solid var(--green)}
.mark-btn.add:hover{background:var(--green-dk);border-color:var(--green-dk)}
.mark-btn.undo{background:#fff;color:var(--green);border:2px solid var(--green)}
.mark-btn.undo:hover{background:var(--green-pale)}
.sec-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.pkg-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pkg-inner{padding:14px 16px}
.pkg-parent{font-size:13px;color:var(--muted);margin-bottom:10px}
.pkg-parent strong{color:var(--text)}
.pkg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pkg-stat{background:var(--bg);border-radius:var(--radius);padding:12px 14px}
.pkg-stat .v{font-size:24px;font-weight:700;color:var(--green)}
.pkg-stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.pkg-stat.zero .v{color:var(--red-txt)}
.pkg-drill-btn{width:100%;padding:9px 14px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--blue);background:var(--blue-pale);border:none;border-top:1px solid var(--border);cursor:pointer;text-align:left;transition:background .15s;display:flex;align-items:center;gap:6px}
.pkg-drill-btn:hover{background:var(--blue-lt)}
.hist-wrap{border-top:1px solid var(--border);background:#fafcff;display:none}
.hist-wrap.open{display:block}
.hist-label{padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);background:var(--blue-lt)}
.no-pkg{background:var(--amber);border:1px solid var(--amber-bd);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--amber-txt);display:flex;align-items:center;gap:8px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .35s}
.prog-fill.complete{background:var(--green-dk)}
.pre-toggle{width:100%;padding:9px 14px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--amber-txt);background:var(--amber);border:1px solid var(--amber-bd);border-radius:var(--radius);cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pre-wrap{display:none;margin-bottom:12px}
.pre-wrap.open{display:block}
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
thead th{padding:9px 10px;background:var(--green);color:#fff;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left}
thead th:first-child{width:36px;text-align:center}
thead th:nth-child(2){width:90px}
thead th:nth-child(3){width:80px}
thead th:nth-child(4){width:140px}
thead th:nth-child(5){width:140px}
tbody tr{border-bottom:1px solid #f0f4ec;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--green-pale)}
tbody tr.sess-done{background:#fafafa}
tbody tr.sess-done td:not(.cb-cell){color:#aaa}
tbody tr.sess-done td:not(.cb-cell) span{text-decoration:line-through}
td{padding:7px 10px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.cb-cell{text-align:center;width:36px}
.sess-cb{width:14px;height:14px;accent-color:var(--green);cursor:pointer;display:block;margin:0 auto}
.loc-chip{font-size:11px;background:var(--blue-lt);color:var(--blue);border-radius:6px;padding:2px 8px;white-space:nowrap;display:inline-block}
.loc-chip.pre{background:var(--amber);color:var(--amber-txt)}
.hist-table thead th{background:var(--blue)}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

    </div>
    <div class="s-io">
      <button class="io-btn export" onclick="exportProgress()">Export progress</button>
      <label class="io-btn import">Import progress<input type="file" accept=".json" style="display:none" onchange="importProgress(event)"></label>
    </div>
    <div class="s-list" id="list"></div>
  </div>
  <div class="main" id="main">
    <div class="empty" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>Select a student from the list<br>to view their package and sessions.</p>
    </div>
    <div class="detail-wrap" id="detail" style="display:none"></div>
  </div>
</div>
<script>
var DATA = JSON.parse(document.getElementById('weo-data').textContent);
var S={
  sess:function(){try{return JSON.parse(localStorage.getItem('weo_sess')||'{}')}catch(e){return{}}},
  stu:function(){try{return JSON.parse(localStorage.getItem('weo_stu')||'{}')}catch(e){return{}}},
  setSess:function(k,v){var d=this.sess();d[k]=v;localStorage.setItem('weo_sess',JSON.stringify(d));},
  setStu:function(n,v){var d=this.stu();d[n]=v;localStorage.setItem('weo_stu',JSON.stringify(d));},
  key:function(name,sess){return name+'|'+sess.d+'|'+sess.t;}
};
function isDone(s){if(S.stu()[s.n])return true;if(!s.ss.length)return false;var sd=S.sess();return s.ss.every(function(x){return sd[S.key(s.n,x)];});}
function prog(s){var sd=S.sess();return s.ss.filter(function(x){return sd[S.key(s.n,x)];}).length;}
var sel=null,filt='all',q='',sortBy='name',edFilt='all';
function esc(str){return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');}
function renderList(){
  var list=document.getElementById('list');
  var ql=q.toLowerCase();
  var items=DATA.filter(function(s){
    if(ql&&s.n.toLowerCase().indexOf(ql)<0)return false;
    if(edFilt!=='all'&&s.ed!==edFilt)return false;
    if(filt==='bridge')return s.sv==='Bridge Program';
    if(filt==='launch')return s.sv==='Launch Program';
    if(filt==='early')return s.se;
    if(filt==='todo')return !isDone(s);
    return true;
  });
  items.sort(function(a,b){
    if(sortBy==='sessions')return b.ss.length-a.ss.length||a.n.localeCompare(b.n);
    return a.n.localeCompare(b.n);
  });
  var doneN=items.filter(isDone).length;
  document.getElementById('list-count').textContent=items.length+' students';
  document.getElementById('done-count').textContent=doneN+' added';
  list.innerHTML=items.map(function(s){
    var done=isDone(s);var p=prog(s);
    return '<div class="li'+(sel===s.n?' active':'')+(done?' done':'')+'" data-n="'+esc(s.n)+'" tabindex="0" role="button">'+
      '<input type="checkbox" class="li-cb" '+(done?'checked':'')+' onclick="event.stopPropagation();markStu(this.closest(\'[data-n]\').dataset.n,this.checked)" aria-label="Mark done">'+
      '<div class="li-body">'+
        '<div class="li-name">'+esc(s.n)+'</div>'+
        '<div class="li-sub">'+esc(s.sv)+'</div>'+
      '</div>'+
      '<div class="li-right">'+
        (done?'<span class="chip chip-done">Added</span>':'<span class="chip chip-prog">'+p+' / '+s.ss.length+'</span>')+
        (s.se?'<span class="chip chip-early">early</span>':'')+
      '</div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('.li').forEach(function(el){
    el.addEventListener('click',function(){sel=el.dataset.n;renderList();renderDetail();});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){sel=el.dataset.n;renderList();renderDetail();}});
  });
}
function markStu(name,val){
  S.setStu(name,val);
  if(!val){var s=DATA.find(function(d){return d.n===name;});if(s)s.ss.forEach(function(x){S.setSess(S.key(name,x),false);});}
  renderList();if(sel===name)renderDetail();
}
function markSess(name,key,val){
  S.setSess(key,val);
  var s=DATA.find(function(d){return d.n===name;});
  if(s){var allDone=s.ss.every(function(x){return S.sess()[S.key(name,x)];});if(allDone)S.setStu(name,true);else if(!val)S.setStu(name,false);}
  var s2=DATA.find(function(d){return d.n===name;});if(s2)refreshMeta(s2);renderList();
}
function refreshMeta(s){
  var done=isDone(s);var p=prog(s);var tot=s.ss.length;var pct=tot?Math.round(p/tot*100):100;
  var bar=document.getElementById('pfill');var lbl=document.getElementById('plbl');var pctEl=document.getElementById('ppct');
  var btn=document.getElementById('mbtn');var dn=document.getElementById('dname');
  if(bar){bar.style.width=pct+'%';bar.className='prog-fill'+(done?' complete':'');}
  if(lbl)lbl.textContent=p+' of '+tot+' sessions added';
  if(pctEl)pctEl.textContent=pct+'%';
  if(btn){btn.textContent=done?'Undo — not in Noto':'Mark all added to Noto';btn.className='mark-btn '+(done?'undo':'add');}
  if(dn)dn.className='d-name'+(done?' done':'');
}
function sessRows(arr,name,isPre){
  var sd=S.sess();
  return arr.map(function(x){
    var key=S.key(name,x);var checked=!!sd[key];
    return '<tr class="'+(checked&&!isPre?'sess-done':'')+'">'+
      '<td class="cb-cell">'+(isPre?'—':'<input type="checkbox" class="sess-cb" '+(checked?'checked':'')+' onchange="markSess(\''+name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+ '\',\''+key.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+ '\',this.checked)">')+'</td>'+
      '<td><span>'+esc(x.d)+'</span></td><td><span>'+esc(x.w)+'</span></td><td><span>'+esc(x.t)+'</span></td>'+
      '<td><span>'+esc(x.e)+'</span></td><td><span class="loc-chip'+(isPre?' pre':'')+'" title="'+esc(x.l)+'">'+esc(x.l)+'</span></td>'+
    '</tr>';
  }).join('');
}
function histRows(arr){
  return arr.map(function(x){
    return '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.w)+'</td><td>'+esc(x.t)+'</td><td>'+esc(x.e)+'</td><td><span class="loc-chip" title="'+esc(x.l)+'">'+esc(x.l)+'</span></td></tr>';
  }).join('');
}
function renderDetail(){
  var empty=document.getElementById('empty-state');var det=document.getElementById('detail');
  if(!sel){empty.style.display='flex';det.style.display='none';return;}
  var s=DATA.find(function(d){return d.n===sel;});
  if(!s){empty.style.display='flex';det.style.display='none';return;}
  empty.style.display='none';det.style.display='block';
  var done=isDone(s);var p=prog(s);var tot=s.ss.length;var pct=tot?Math.round(p/tot*100):100;
  var sn=s.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  var pkg=s.p;
  var pkgHtml=pkg
    ?('<div class="pkg-card"><div class="pkg-inner">'+
        '<div class="pkg-parent">Parent account: <strong>'+esc(pkg.par)+'</strong> &nbsp;&middot;&nbsp; '+esc(pkg.svc)+'</div>'+
        '<div class="pkg-stats">'+
          '<div class="pkg-stat"><div class="v">'+pkg.pu+'</div><div class="l">Purchased</div></div>'+
          '<div class="pkg-stat"><div class="v">'+pkg.us+'</div><div class="l">Used (all time)</div></div>'+
          '<div class="pkg-stat '+(pkg.un===0?'zero':'')+'"><div class="v">'+pkg.un+'</div><div class="l">Remaining</div></div>'+
        '</div>'+
      '</div>'+
      '<button class="pkg-drill-btn" id="drill-btn" onclick="toggleHist()">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
        'View all '+s.hist.length+' sessions on this package (full year)'+
        '<svg id="drill-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</button>'+
      '<div class="hist-wrap" id="hist-wrap">'+
        '<div class="hist-label">All sessions — Jan through Aug 2026</div>'+
        '<div class="tbl-wrap" style="border-radius:0;border:none">'+
          '<table class="hist-table"><thead><tr><th>Date</th><th>Day</th><th>Time</th><th>Educator</th><th>Location</th></tr></thead>'+
          '<tbody>'+histRows(s.hist)+'</tbody></table>'+
        '</div>'+
      '</div></div>')
    :'<div class="no-pkg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>No package found — may need to be created in Noto manually</div>';
  var preHtml=s.se
    ?('<button class="pre-toggle" id="pre-btn" onclick="togglePre()">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
        s.ps.length+' session'+(s.ps.length!==1?'s':'')+' before Jul 6 (pre-summer) — tap to view'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</button>'+
      '<div class="pre-wrap" id="pre-wrap">'+
        '<div class="tbl-wrap"><table>'+
          '<thead><tr><th style="width:36px;text-align:center">—</th><th>Date</th><th>Day</th><th>Time</th><th>Educator</th><th>Location</th></tr></thead>'+
          '<tbody>'+sessRows(s.ps,s.n,true)+'</tbody></table></div></div>')
    :'';
  det.innerHTML=
    '<div class="d-top">'+
      '<div>'+
        '<div class="d-name'+(done?' done':'')+'" id="dname">'+esc(s.n)+'</div>'+
        '<div class="d-chips">'+
          '<span class="d-chip d-chip-svc">'+esc(s.sv)+'</span>'+
          '<span class="d-chip d-chip-ed">'+esc(s.ed)+'</span>'+
          (s.se?'<span class="d-chip d-chip-early">Started before Jul 6</span>':'')+
          (done?'<span class="d-chip d-chip-done">Added to Noto</span>':'')+
        '</div>'+
      '</div>'+
      '<button id="mbtn" class="mark-btn '+(done?'undo':'add')+'" onclick="markStu(\''+sn+'\','+(done?'false':'true')+')">'+
        (done?'Undo — not in Noto':'Mark all added to Noto')+
      '</button>'+
    '</div>'+
    '<div class="sec-hd">Package</div>'+
    pkgHtml+
    '<div class="sec-hd" style="margin-top:28px">Summer sessions <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">(Jul 6 – Aug 31, 2026)</span></div>'+
    '<div class="prog-row"><span id="plbl">'+p+' of '+tot+' sessions added</span><span id="ppct">'+pct+'%</span></div>'+
    '<div class="prog-bar"><div class="prog-fill'+(done?' complete':'')+'" id="pfill" style="width:'+pct+'%"></div></div>'+
    preHtml+
    '<div class="tbl-wrap"><table>'+
      '<thead><tr><th>Added</th><th>Date</th><th>Day</th><th>Time</th><th>Educator</th><th>Location</th></tr></thead>'+
      '<tbody>'+sessRows(s.ss,s.n,false)+'</tbody></table></div>';
}
window.toggleHist=function(){
  var w=document.getElementById('hist-wrap');var a=document.getElementById('drill-arrow');
  if(!w)return;w.classList.toggle('open');if(a)a.style.transform=w.classList.contains('open')?'rotate(180deg)':'';
};
window.togglePre=function(){
  var w=document.getElementById('pre-wrap');var b=document.getElementById('pre-btn');
  if(!w)return;w.classList.toggle('open');if(b){var arr=b.querySelector('svg:last-child');if(arr)arr.style.transform=w.classList.contains('open')?'rotate(180deg)':'';}
};
window.exportProgress=function(){
  var blob=new Blob([JSON.stringify({sessions:S.sess(),students:S.stu(),exported:new Date().toISOString()},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noto_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
window.importProgress=function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);
      if(d.sessions)localStorage.setItem('weo_sess',JSON.stringify(d.sessions));
      if(d.students)localStorage.setItem('weo_stu',JSON.stringify(d.students));
      renderList();renderDetail();alert('Imported! '+Object.keys(d.students||{}).filter(function(k){return d.students[k];}).length+' students marked done.');
    }catch(err){alert('Could not read file: '+err.message);}
  };r.readAsText(file);
};
document.getElementById('search').addEventListener('input',function(e){q=e.target.value;renderList();});
document.getElementById('filters').addEventListener('click',function(e){
  var b=e.target.closest('.fb');if(!b)return;
  filt=b.dataset.f;document.querySelectorAll('.fb').forEach(function(x){x.classList.toggle('on',x===b);});renderList();
});
document.getElementById('sort-select').addEventListener('change',function(e){sortBy=e.target.value;renderList();});
document.getElementById('educator-select').addEventListener('change',function(e){edFilt=e.target.value;renderList();});
(function populateEducators(){
  var edSel=document.getElementById('educator-select');
  var eds=Array.from(new Set(DATA.map(function(s){return s.ed;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});
  eds.forEach(function(ed){
    var opt=document.createElement('option');opt.value=ed;opt.textContent=ed;edSel.appendChild(opt);
  });
})();
renderList();
</script>
</body>
</html>
