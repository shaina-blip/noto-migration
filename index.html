  <div class="main" id="main">
    <div class="empty" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>Select a student from the list<br>to view their package and sessions.</p>
    </div>
    <div class="detail-wrap" id="detail" style="display:none"></div>
  </div>
</div>
<script>
var DATA = JSON.parse(document.getElementById('weo-data').textContent);
(function fixMismatchedEducators(){
  DATA.forEach(function(s){
    var pool=(s.hist&&s.hist.length?s.hist:s.ss)||[];
    var counts={};
    pool.forEach(function(x){counts[x.e]=(counts[x.e]||0)+1;});
    var names=Object.keys(counts);
    if(!names.length||names.indexOf(s.ed)!==-1)return;
    var max=Math.max.apply(null,names.map(function(n){return counts[n];}));
    var top=names.filter(function(n){return counts[n]===max;});
    s.ed=top.length===1?top[0]:'Multiple educators';
  });
})();
(function fixMismatchedProgram(){
  DATA.forEach(function(s){
    if(s.p&&s.p.svc&&s.p.svc!==s.sv)s.sv=s.p.svc;
  });
})();
var S={
  sess:function(){try{return JSON.parse(localStorage.getItem('weo_sess')||'{}')}catch(e){return{}}},
  stu:function(){try{return JSON.parse(localStorage.getItem('weo_stu')||'{}')}catch(e){return{}}},
  setSess:function(k,v){var d=this.sess();d[k]=v;localStorage.setItem('weo_sess',JSON.stringify(d));},
  setStu:function(n,v){var d=this.stu();d[n]=v;localStorage.setItem('weo_stu',JSON.stringify(d));},
  key:function(name,sess){return name+'|'+sess.d+'|'+sess.t;}
};
function isDone(s){if(S.stu()[s.n])return true;if(!s.ss.length)return false;var sd=S.sess();return s.ss.every(function(x){return sd[S.key(s.n,x)];});}
function prog(s){var sd=S.sess();return s.ss.filter(function(x){return sd[S.key(s.n,x)];}).length;}
var sel=null,filt='all',q='',sortBy='name',edFilt='all';
function esc(str){return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');}
function fmtMoney(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){var p=iso.split('-');return MONTHS[parseInt(p[1],10)-1]+' '+parseInt(p[2],10)+', '+p[0];}
function renderList(){
  var list=document.getElementById('list');
  var ql=q.toLowerCase();
  var items=DATA.filter(function(s){
    if(ql&&s.n.toLowerCase().indexOf(ql)<0)return false;
    if(edFilt!=='all'&&s.ed!==edFilt)return false;
    if(filt==='bridge')return s.sv==='Bridge Program';
    if(filt==='launch')return s.sv==='Launch Program';
    if(filt==='early')return s.se;
    if(filt==='todo')return !isDone(s);
    if(filt==='balance')return s.p&&s.p.un>0;
    return true;
  });
  items.sort(function(a,b){
    if(sortBy==='sessions')return b.ss.length-a.ss.length||a.n.localeCompare(b.n);
    return a.n.localeCompare(b.n);
  });
  var doneN=items.filter(isDone).length;
  document.getElementById('list-count').textContent=items.length+' students';
  document.getElementById('done-count').textContent=doneN+' added';
  list.innerHTML=items.map(function(s){
    var done=isDone(s);var p=prog(s);
    return '<div class="li'+(sel===s.n?' active':'')+(done?' done':'')+'" data-n="'+esc(s.n)+'" tabindex="0" role="button">'+
      '<input type="checkbox" class="li-cb" '+(done?'checked':'')+' onclick="event.stopPropagation();markStu(this.closest(\'[data-n]\').dataset.n,this.checked)" aria-label="Mark done">'+
      '<div class="li-body">'+
        '<div class="li-name">'+esc(s.n)+'</div>'+
        '<div class="li-sub">'+esc(s.sv)+'</div>'+
      '</div>'+
      '<div class="li-right">'+
        (done?'<span class="chip chip-done">Added</span>':'<span class="chip chip-prog">'+p+' / '+s.ss.length+'</span>')+
        (s.se?'<span class="chip chip-early">early</span>':'')+
        (s.p&&s.p.un>0?'<span class="chip chip-balance">'+s.p.un+' left</span>':'')+
        (s.p&&s.p.ov>0?'<span class="chip chip-over">'+s.p.ov+' over</span>':'')+
      '</div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('.li').forEach(function(el){
    el.addEventListener('click',function(){sel=el.dataset.n;renderList();renderDetail();});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){sel=el.dataset.n;renderList();renderDetail();}});
  });
}
function markStu(name,val){
  S.setStu(name,val);
  if(!val){var s=DATA.find(function(d){return d.n===name;});if(s)s.ss.forEach(function(x){S.setSess(S.key(name,x),false);});}
  renderList();if(sel===name)renderDetail();
}
function markSess(name,key,val){
  S.setSess(key,val);
  var s=DATA.find(function(d){return d.n===name;});
  if(s){var allDone=s.ss.every(function(x){return S.sess()[S.key(name,x)];});if(allDone)S.setStu(name,true);else if(!val)S.setStu(name,false);}
  var s2=DATA.find(function(d){return d.n===name;});if(s2)refreshMeta(s2);renderList();
}
function refreshMeta(s){
  var done=isDone(s);var p=prog(s);var tot=s.ss.length;var pct=tot?Math.round(p/tot*100):100;
  var bar=document.getElementById('pfill');var lbl=document.getElementById('plbl');var pctEl=document.getElementById('ppct');
  var btn=document.getElementById('mbtn');var dn=document.getElementById('dname');
  if(bar){bar.style.width=pct+'%';bar.className='prog-fill'+(done?' complete':'');}
  if(lbl)lbl.textContent=p+' of '+tot+' sessions added';
  if(pctEl)pctEl.textContent=pct+'%';
  if(btn){btn.textContent=done?'Undo — not in Noto':'Mark all added to Noto';btn.className='mark-btn '+(done?'undo':'add');}
  if(dn)dn.className='d-name'+(done?' done':'');
}
function statusInfo(st){
  if(!st)return null;
  if(st.indexOf('Attended')===0)return{cls:'attended',label:'Attended'};
  if(st.indexOf('Scheduled')===0)return{cls:'scheduled',label:'Scheduled'};
  if(st.indexOf('Cancelled')===0)return{cls:'cancelled',label:'Cancelled'};
  if(st.indexOf('Missed')===0)return{cls:'missed',label:'Missed'};
  return{cls:'other',label:st};
}
function programCell(sv){
  if(!sv)return '<td><span class="muted-dash">—</span></td>';
  return '<td><span class="prog-chip" title="'+esc(sv)+'">'+esc(sv)+'</span></td>';
}
function statusCell(st){
  if(!st)return '<td><span class="muted-dash">—</span></td>';
  var info=statusInfo(st);
  return '<td><span class="status-chip status-'+info.cls+'" title="'+esc(st)+'">'+esc(info.label)+'</span></td>';
}
function sessRows(arr,name,isPre){
  var sd=S.sess();
  return arr.map(function(x){
    var key=S.key(name,x);var checked=!!sd[key];
    return '<tr class="'+(checked&&!isPre?'sess-done':'')+'">'+
      '<td class="cb-cell">'+(isPre?'—':'<input type="checkbox" class="sess-cb" '+(checked?'checked':'')+' onchange="markSess(\''+name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+ '\',\''+key.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+ '\',this.checked)">')+'</td>'+
      '<td><span>'+esc(x.d)+'</span></td><td><span>'+esc(x.w)+'</span></td><td><span>'+esc(x.t)+'</span></td>'+
      programCell(x.sv)+statusCell(x.st)+
      '<td><span>'+esc(x.e)+'</span></td><td><span class="loc-chip'+(isPre?' pre':'')+'" title="'+esc(x.l)+'">'+esc(x.l)+'</span></td>'+
    '</tr>';
  }).join('');
}
function histRows(arr){
  return arr.map(function(x){
    return '<tr><td>'+esc(x.d)+'</td><td>'+esc(x.w)+'</td><td>'+esc(x.t)+'</td>'+
      programCell(x.sv)+statusCell(x.st)+
      '<td>'+esc(x.e)+'</td><td><span class="loc-chip" title="'+esc(x.l)+'">'+esc(x.l)+'</span></td></tr>';
  }).join('');
}
function renderDetail(){
  var empty=document.getElementById('empty-state');var det=document.getElementById('detail');
  if(!sel){empty.style.display='flex';det.style.display='none';return;}
  var s=DATA.find(function(d){return d.n===sel;});
  if(!s){empty.style.display='flex';det.style.display='none';return;}
  empty.style.display='none';det.style.display='block';
  var done=isDone(s);var p=prog(s);var tot=s.ss.length;var pct=tot?Math.round(p/tot*100):100;
  var sn=s.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  var pkg=s.p;
  var pkgHtml=pkg
    ?('<div class="pkg-card"><div class="pkg-inner">'+
        '<div class="pkg-parent">Parent account: <strong>'+esc(pkg.par)+'</strong> &nbsp;&middot;&nbsp; '+esc(pkg.svc)+'</div>'+
        (pkg.inv?(
          '<div class="pkg-invoice">'+
            '<span class="inv-tag">Most recent invoice</span>'+
            '<span class="inv-amt">'+fmtMoney(pkg.inv.total)+'</span>'+
            '<span class="inv-date">'+fmtDate(pkg.inv.date)+'</span>'+
            (pkg.inv.balance>0?'<span class="inv-due">'+fmtMoney(pkg.inv.balance)+' due</span>':'<span class="inv-paid">Paid in full</span>')+
            '<a class="inv-link" href="'+esc(pkg.inv.url)+'" target="_blank" rel="noopener noreferrer">View invoice &rarr;</a>'+
          '</div>'
        ):'')+
        '<div class="pkg-stats">'+
          '<div class="pkg-stat"><div class="v">'+pkg.pu+'</div><div class="l">Purchased</div></div>'+
          (pkg.sch!=null?'<div class="pkg-stat '+(pkg.oversch>0?'zero':'')+'"><div class="v">'+pkg.sch+'</div><div class="l">Scheduled</div></div>':'')+
          '<div class="pkg-stat"><div class="v">'+pkg.us+'</div><div class="l">Used (all time)</div></div>'+
          '<div class="pkg-stat '+(pkg.un===0?'zero':'')+'"><div class="v">'+pkg.un+'</div><div class="l">Remaining</div></div>'+
        '</div>'+
      '</div>'+
      '<button class="pkg-drill-btn" id="drill-btn" onclick="toggleHist()">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
        'View all '+s.hist.length+' sessions on this package (full year)'+
        '<svg id="drill-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</button>'+
      '<div class="hist-wrap" id="hist-wrap">'+
        '<div class="hist-label">All sessions — Jan through Aug 2026</div>'+
        '<div class="tbl-wrap" style="border-radius:0;border:none">'+
          '<table class="hist-table"><thead><tr><th>Date</th><th>Day</th><th>Time</th><th>Program</th><th>Status</th><th>Educator</th><th>Location</th></tr></thead>'+
          '<tbody>'+histRows(s.hist)+'</tbody></table>'+
        '</div>'+
      '</div></div>')
    :'<div class="no-pkg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>No package found — may need to be created in Noto manually</div>';
  var preHtml=s.se
    ?('<button class="pre-toggle" id="pre-btn" onclick="togglePre()">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
        s.ps.length+' session'+(s.ps.length!==1?'s':'')+' before Jul 6 (pre-summer) — tap to view'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>'+
      '</button>'+
      '<div class="pre-wrap" id="pre-wrap">'+
        '<div class="tbl-wrap"><table>'+
          '<thead><tr><th style="width:36px;text-align:center">—</th><th>Date</th><th>Day</th><th>Time</th><th>Program</th><th>Status</th><th>Educator</th><th>Location</th></tr></thead>'+
          '<tbody>'+sessRows(s.ps,s.n,true)+'</tbody></table></div></div>')
    :'';
  det.innerHTML=
    '<div class="d-top">'+
      '<div>'+
        '<div class="d-name'+(done?' done':'')+'" id="dname">'+esc(s.n)+'</div>'+
        '<div class="d-chips">'+
          '<span class="d-chip d-chip-svc">'+esc(s.sv)+'</span>'+
          '<span class="d-chip d-chip-ed">'+esc(s.ed)+'</span>'+
          (s.se?'<span class="d-chip d-chip-early">Started before Jul 6</span>':'')+
          (done?'<span class="d-chip d-chip-done">Added to Noto</span>':'')+
        '</div>'+
      '</div>'+
      '<button id="mbtn" class="mark-btn '+(done?'undo':'add')+'" onclick="markStu(\''+sn+'\','+(done?'false':'true')+')">'+
        (done?'Undo — not in Noto':'Mark all added to Noto')+
      '</button>'+
    '</div>'+
    '<div class="sec-hd">Package</div>'+
    pkgHtml+
    '<div class="sec-hd" style="margin-top:28px">Summer sessions <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">(Jul 6 – Aug 31, 2026)</span></div>'+
    '<div class="prog-row"><span id="plbl">'+p+' of '+tot+' sessions added</span><span id="ppct">'+pct+'%</span></div>'+
    '<div class="prog-bar"><div class="prog-fill'+(done?' complete':'')+'" id="pfill" style="width:'+pct+'%"></div></div>'+
    preHtml+
    '<div class="tbl-wrap"><table>'+
      '<thead><tr><th>Added</th><th>Date</th><th>Day</th><th>Time</th><th>Program</th><th>Status</th><th>Educator</th><th>Location</th></tr></thead>'+
      '<tbody>'+sessRows(s.ss,s.n,false)+'</tbody></table></div>';
}
window.toggleHist=function(){
  var w=document.getElementById('hist-wrap');var a=document.getElementById('drill-arrow');
  if(!w)return;w.classList.toggle('open');if(a)a.style.transform=w.classList.contains('open')?'rotate(180deg)':'';
};
window.togglePre=function(){
  var w=document.getElementById('pre-wrap');var b=document.getElementById('pre-btn');
  if(!w)return;w.classList.toggle('open');if(b){var arr=b.querySelector('svg:last-child');if(arr)arr.style.transform=w.classList.contains('open')?'rotate(180deg)':'';}
};
window.exportProgress=function(){
  var blob=new Blob([JSON.stringify({sessions:S.sess(),students:S.stu(),exported:new Date().toISOString()},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noto_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
window.importProgress=function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);
      if(d.sessions)localStorage.setItem('weo_sess',JSON.stringify(d.sessions));
      if(d.students)localStorage.setItem('weo_stu',JSON.stringify(d.students));
      renderList();renderDetail();alert('Imported! '+Object.keys(d.students||{}).filter(function(k){return d.students[k];}).length+' students marked done.');
    }catch(err){alert('Could not read file: '+err.message);}
  };r.readAsText(file);
};
document.getElementById('search').addEventListener('input',function(e){q=e.target.value;renderList();});
document.getElementById('filters').addEventListener('click',function(e){
  var b=e.target.closest('.fb');if(!b)return;
  filt=b.dataset.f;document.querySelectorAll('.fb').forEach(function(x){x.classList.toggle('on',x===b);});renderList();
});
document.getElementById('sort-select').addEventListener('change',function(e){sortBy=e.target.value;renderList();});
document.getElementById('educator-select').addEventListener('change',function(e){edFilt=e.target.value;renderList();});
(function populateEducators(){
  var edSel=document.getElementById('educator-select');
  var eds=Array.from(new Set(DATA.map(function(s){return s.ed;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});
  eds.forEach(function(ed){
    var opt=document.createElement('option');opt.value=ed;opt.textContent=ed;edSel.appendChild(opt);
  });
})();
renderList();
</script>
</body>
</html>
